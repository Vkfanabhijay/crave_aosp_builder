name: Crave Builder

on:
  workflow_dispatch:
    inputs:
      BASE_PROJECT:
        description: 'Choose a base project:'
        required: true
        default: 'LineageOS 23.2'
        type: choice
        options:
          - 'LineageOS 23.2'
          - 'LineageOS 22.1'
          - 'LineageOS 21.0'
          - 'LineageOS 20.0'
          - 'ArrowOS 13.1'
          - 'DerpFest 14.0'
          - 'CipherOS 14'
          - 'PixelOS 15'
          - 'RisingOS 15 Revived'
          - 'LineageOS 18.1'
          - 'LineageOS 16.0'
          - 'CyanogenMOD 14.1'
          - 'AOSP'

      BUILD_DIFFERENT_ROM:
        description: "Command to initialize a different 'repo' project:"
        required: false
        default: "echo 'Build Starting!'"

      REMOVALS:
        description: "Folders to be removed before syncing:"
        required: false
        default: ""

      LOCAL_MANIFEST:
        description: "Personal local manifest [repository or raw]:"
        required: true
        default: 'https://github.com/sounddrill31/local_manifests_oxygen'

      LOCAL_MANIFEST_BRANCH:
        description: "Personal local manifest's branch:"
        required: false
        default: 'lineage-23.2'

      DEVICE_NAME:
        description: "Device's codename:"
        required: true
        default: "oxygen"

      PRODUCT_NAME:
        description: "Product to build:"
        required: true
        default: "oxygen"

      BUILD_COMMAND:
        description: 'Command to be used for compiling:'
        required: true
        default: 'mka bacon'

      BUILD_TYPE:
        description: 'Type of build:'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - 'eng'
          - 'userdebug'
          - 'user'

      CLEAN_BUILD:
        description: 'Build with a clean workspace?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:

  prepare:
    name: Prepare Build
    runs-on: self-hosted

    outputs:
      PROJECTFOLDER: ${{ steps.variables.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ steps.variables.outputs.PROJECTID }}
      REPO_INIT: ${{ steps.variables.outputs.REPO_INIT }}
      LUNCH: ${{ steps.variables.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ steps.variables.outputs.LOCAL_MANIFEST }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Crave credentials
        run: |
          if [ -z "${CRAVE_USERNAME}" ]; then
            echo "CRAVE_USERNAME is missing!"
            exit 1
          fi

          if [ -z "${CRAVE_TOKEN}" ]; then
            echo "CRAVE_TOKEN is missing!"
            exit 1
          fi

          echo "Crave credentials are configured."
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            jq \
            tmux \
            git \
            unzip

      - name: Configure Crave
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh \
            | bash -s --

          mv crave "$HOME/bin/crave"
          chmod +x "$HOME/bin/crave"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          if [ ! -f crave.conf.sample ]; then
            echo "crave.conf.sample was not created!"
            exit 1
          fi

          envsubst < crave.conf.sample > "$HOME/crave.conf"

          echo "Crave configuration created."

          crave --help >/dev/null

          echo "Crave CLI installed successfully."
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Set project variables
        id: variables
        shell: bash
        run: |

          case "${{ inputs.BASE_PROJECT }}" in

            "LineageOS 23.2")
              PROJECTFOLDER="/tmp/Lineage23"
              PROJECTID="95"
              REPO_INIT="repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs --depth=1"
              ;;

            "LineageOS 22.1")
              PROJECTFOLDER="/tmp/Lineage22"
              PROJECTID="93"
              REPO_INIT="repo init -u https://github.com/accupara/los22.git -b lineage-22.1 --git-lfs --depth=1"
              ;;

            "LineageOS 21.0")
              PROJECTFOLDER="/tmp/Lineage21"
              PROJECTID="72"
              REPO_INIT="repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1"
              ;;

            "LineageOS 20.0")
              PROJECTFOLDER="/tmp/Lineage20"
              PROJECTID="36"
              REPO_INIT="repo init -u https://github.com/accupara/los20.git -b lineage-20.0 --git-lfs --depth=1"
              ;;

            "ArrowOS 13.1")
              PROJECTFOLDER="/tmp/Arrow13"
              PROJECTID="73"
              REPO_INIT="repo init -u https://github.com/ArrowOS/android_manifest.git -b arrow-13.1 --depth=1"
              ;;

            "DerpFest 14.0")
              PROJECTFOLDER="/tmp/DerpFest14"
              PROJECTID="64"
              REPO_INIT="repo init -u https://github.com/DerpFest-AOSP/manifest.git -b 14 --depth=1"
              ;;

            "CipherOS 14")
              PROJECTFOLDER="/tmp/Cipher14"
              PROJECTID="79"
              REPO_INIT="repo init -u https://github.com/CipherOS/android_manifest.git -b fourteen --git-lfs --depth=1"
              ;;

            "PixelOS 15")
              PROJECTFOLDER="/tmp/Pixel15"
              PROJECTID="82"
              REPO_INIT="repo init -u https://github.com/PixelOS-AOSP/manifest.git -b fifteen --git-lfs --depth=1"
              ;;

            "RisingOS 15 Revived")
              PROJECTFOLDER="/tmp/Rising15"
              PROJECTID="86"
              REPO_INIT="repo init -u https://github.com/RisingOS-Revived/android.git -b fifteen --git-lfs --depth=1"
              ;;

            "LineageOS 18.1")
              PROJECTFOLDER="/tmp/Lineage18"
              PROJECTID="85"
              REPO_INIT="repo init -u https://github.com/accupara/los18.1.git -b lineage-18.1 --git-lfs --depth=1"
              ;;

            "LineageOS 16.0")
              PROJECTFOLDER="/tmp/Lineage16"
              PROJECTID="81"
              REPO_INIT="repo init -u https://github.com/accupara/los16.git -b lineage-16.0 --git-lfs --depth=1"
              ;;

            "CyanogenMOD 14.1")
              PROJECTFOLDER="/tmp/Cyanogen14"
              PROJECTID="83"
              REPO_INIT="repo init -u https://github.com/accupara/los-cm14.1.git -b cm-14.1 --git-lfs --depth=1"
              ;;

            "AOSP")
              PROJECTFOLDER="/tmp/AOSP"
              PROJECTID="35"
              REPO_INIT="repo init -u https://android.googlesource.com/platform/manifest.git -b master --git-lfs --depth=1"
              ;;

            *)
              echo "Unknown BASE_PROJECT"
              exit 1
              ;;
          esac

          if [[ "${{ inputs.PRODUCT_NAME }}" == *_* ]] &&
             [[ "${{ inputs.PRODUCT_NAME }}" != gsi_* ]] &&
             [[ "${{ inputs.PRODUCT_NAME }}" != sdk_* ]] &&
             [[ "${{ inputs.PRODUCT_NAME }}" != *_sprout ]] &&
             [[ "${{ inputs.PRODUCT_NAME }}" != Mi439_* ]] &&
             [[ "${{ inputs.PRODUCT_NAME }}" != Mi8937_* ]]; then

            LUNCH="lunch ${{ inputs.PRODUCT_NAME }}-${{ inputs.BUILD_TYPE }}"

          elif [[ "${{ inputs.BASE_PROJECT }}" == "RisingOS 15 Revived" ]] &&
                [[ "${{ inputs.BUILD_DIFFERENT_ROM }}" == "echo 'Build Starting!'" ]]; then

            LUNCH="riseup ${{ inputs.PRODUCT_NAME }} ${{ inputs.BUILD_TYPE }}"

          else

            LUNCH="breakfast ${{ inputs.PRODUCT_NAME }} ${{ inputs.BUILD_TYPE }}"

          fi

          if [[ "${{ inputs.LOCAL_MANIFEST }}" =~ \.xml/?$ ]]; then

            LOCAL_MANIFEST="mkdir -p .repo/local_manifests && rm -rf .repo/local_manifests/* && curl -fL -o .repo/local_manifests/local_manifest.xml '${{ inputs.LOCAL_MANIFEST }}'"

          else

            LOCAL_MANIFEST="git clone '${{ inputs.LOCAL_MANIFEST }}' --depth 1 -b '${{ inputs.LOCAL_MANIFEST_BRANCH }}' .repo/local_manifests"

          fi

          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_OUTPUT"
          echo "PROJECTID=$PROJECTID" >> "$GITHUB_OUTPUT"
          echo "REPO_INIT=$REPO_INIT" >> "$GITHUB_OUTPUT"
          echo "LUNCH=$LUNCH" >> "$GITHUB_OUTPUT"
          echo "LOCAL_MANIFEST=$LOCAL_MANIFEST" >> "$GITHUB_OUTPUT"

          echo "================================="
          echo "Base project : ${{ inputs.BASE_PROJECT }}"
          echo "Project ID   : $PROJECTID"
          echo "Device       : ${{ inputs.DEVICE_NAME }}"
          echo "Product      : ${{ inputs.PRODUCT_NAME }}"
          echo "Build type   : ${{ inputs.BUILD_TYPE }}"
          echo "Lunch        : $LUNCH"
          echo "Build command: ${{ inputs.BUILD_COMMAND }}"
          echo "================================="

  test:
    name: Test Manifest
    needs: prepare
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Test manifest
        shell: bash
        run: |

          mkdir -p tester
          cd tester

          ${{ needs.prepare.outputs.REPO_INIT }}

          if [ "${{ inputs.BUILD_DIFFERENT_ROM }}" != "echo 'Build Starting!'" ]; then
            ${{ inputs.BUILD_DIFFERENT_ROM }}
          fi

          bash -c '${{ needs.prepare.outputs.LOCAL_MANIFEST }}'

          timeout 10m repo sync --force-sync --no-clone-bundle || {
            code=$?

            if [ "$code" -ne 124 ]; then
              echo "repo sync failed with exit code $code"
              exit "$code"
            fi

            echo "Manifest test timed out."
          }

  build:
    name: Build using Crave
    needs:
      - prepare
      - test

    runs-on: self-hosted

    timeout-minutes: 1440

    concurrency:
      group: crave-${{ github.repository }}-${{ github.event.inputs.DEVICE_NAME }}
      cancel-in-progress: false

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            jq \
            git \
            tmux \
            unzip

      - name: Install Crave
        shell: bash
        run: |

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh \
            | bash -s --

          mv crave "$HOME/bin/crave"
          chmod +x "$HOME/bin/crave"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          echo "Installing Crave configuration..."

          envsubst < crave.conf.sample > "$HOME/crave.conf"

          echo "Crave installed."

          crave --help >/dev/null
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Verify Crave authentication
        shell: bash
        run: |
          echo "Checking Crave authentication..."

          if [ -z "${CRAVE_USERNAME}" ]; then
            echo "CRAVE_USERNAME is empty!"
            exit 1
          fi

          if [ -z "${CRAVE_TOKEN}" ]; then
            echo "CRAVE_TOKEN is empty!"
            exit 1
          fi

          echo "Crave credentials are present."
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Create build directory
        run: |
          sudo mkdir -p /crave-devspaces
          sudo chmod 777 /crave-devspaces

          mkdir -p "${{ needs.prepare.outputs.PROJECTFOLDER }}"

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure local manifest
        shell: bash
        run: |

          cd "${{ needs.prepare.outputs.PROJECTFOLDER }}"

          mkdir -p .repo/manifests

          if [ -z "${{ secrets.CUSTOM_YAML }}" ]; then

            cp "$GITHUB_WORKSPACE/configs/crave/crave.yaml.aosp" \
              .repo/manifests/crave.yaml

            echo "Using default Crave configuration."

          else

            printf '%s\n' '${{ secrets.CUSTOM_YAML }}' \
              > .repo/manifests/crave.yaml

            echo "Using custom Crave configuration."

          fi

      - name: Initialize repository
        shell: bash
        run: |

          cd "${{ needs.prepare.outputs.PROJECTFOLDER }}"

          echo "Initializing repository..."

          ${{ needs.prepare.outputs.REPO_INIT }}

          echo "Repository initialized."

      - name: Apply local manifest
        shell: bash
        run: |

          cd "${{ needs.prepare.outputs.PROJECTFOLDER }}"

          rm -rf .repo/local_manifests

          bash -c '${{ needs.prepare.outputs.LOCAL_MANIFEST }}'

          echo "Local manifest applied."

      - name: Queue Crave build
        shell: bash
        run: |

          cd "${{ needs.prepare.outputs.PROJECTFOLDER }}"

          echo "=========================================="
          echo "Submitting build to Crave"
          echo "=========================================="

          if [ "${{ inputs.CLEAN_BUILD }}" = "yes" ]; then
            CLEAN="--clean"
          else
            CLEAN=""
          fi

          if [ -n "${{ secrets.PAID }}" ]; then
            PLATFORM="--platform aosp-silver"
          else
            PLATFORM=""
          fi

          if [ "${{ inputs.BUILD_DIFFERENT_ROM }}" = "echo 'Build Starting!'" ]; then
            DIFFERENT_ROM="${{ needs.prepare.outputs.REPO_INIT }}"
          else
            DIFFERENT_ROM="${{ inputs.BUILD_DIFFERENT_ROM }}"
          fi

          LUNCH="${{ needs.prepare.outputs.LUNCH }}"

          echo "Project ID : ${{ needs.prepare.outputs.PROJECTID }}"
          echo "Device     : ${{ inputs.DEVICE_NAME }}"
          echo "Product    : ${{ inputs.PRODUCT_NAME }}"
          echo "Build type : ${{ inputs.BUILD_TYPE }}"
          echo "Lunch      : $LUNCH"
          echo "Command    : ${{ inputs.BUILD_COMMAND }}"
          echo "=========================================="

          crave ${{ secrets.CRAVE_FLAGS }} run \
            --no-patch \
            $PLATFORM \
            $CLEAN \
            -- "

            rm -rf .repo/local_manifests/

            $DIFFERENT_ROM

            ${{ needs.prepare.outputs.LOCAL_MANIFEST }}

            if [ -f /usr/bin/resync ]; then
              /usr/bin/resync
            elif [ -f /opt/crave/resync.sh ]; then
              /opt/crave/resync.sh
            else
              echo 'resync script not found'
            fi

            export BUILD_USERNAME='${{ github.actor }}'
            export BUILD_HOSTNAME='crave'

            source build/envsetup.sh

            echo 'Repository: ${{ github.repository }}'
            echo 'Run ID: ${{ github.run_id }}'

            $LUNCH

            make installclean

            ${{ inputs.BUILD_COMMAND }}

          "

      - name: Telegram notification
        if: always()
        continue-on-error: true
        run: |

          if [ -z "$botToken" ] || [ -z "$chatId" ]; then
            exit 0
          fi

          STATUS="${{ job.status }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${botToken}/sendMessage" \
            -d "chat_id=${chatId}" \
            -d "text=Crave build ${STATUS}. Device: ${{ inputs.DEVICE_NAME }} | Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null
        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Upload build artifacts
        if: success()
        continue-on-error: true
        shell: bash
        run: |

          cd "${{ needs.prepare.outputs.PROJECTFOLDER }}"

          echo "${{ secrets.GITHUB_TOKEN }}" > token.txt

          crave push \
            token.txt \
            -d "$(crave ssh -- pwd | grep -v Select | sed 's/\r//g')/"

          crave ssh -- "
            export GH_UPLOAD_LIMIT='${{ secrets.GH_UPLOAD_LIMIT }}'
            bash /opt/crave/github-actions/upload.sh \
              '${{ github.run_id }}' \
              '${{ inputs.DEVICE_NAME }}' \
              '${{ github.repository }}' \
              '${{ inputs.PRODUCT_NAME }}-${{ github.run_id }}' \
              '${{ secrets.EXTRA_FILES }}'
          "

      - name: Display error log
        if: failure()
        continue-on-error: true
        shell: bash
        run: |

          cd "${{ needs.prepare.outputs.PROJECTFOLDER }}"

          crave ssh -- sleep 1 || true

          crave pull out/error.log || true

          if [ -f out/error.log ]; then
            echo "================ ERROR.LOG ================"
            cat out/error.log
            echo "==========================================="
          fi

      - name: Telegram upload
        if: success()
        continue-on-error: true
        shell: bash
        run: |

          cd "${{ needs.prepare.outputs.PROJECTFOLDER }}"

          crave ssh -- "
            export TG_UPLOAD_LIMIT='${{ secrets.TG_UPLOAD_LIMIT }}'
            bash /opt/crave/telegram/upload.sh \
              '${{ inputs.DEVICE_NAME }}' \
              '${{ secrets.EXTRA_FILES }}'
          "